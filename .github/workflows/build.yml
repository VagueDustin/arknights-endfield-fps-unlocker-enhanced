name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test compatibility and installer
        run: python -m unittest discover -s tests -v
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test native loader and runtime
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          cmake --install build --config Release --prefix build/package
          python tools/package_build.py build/package
      - name: Build standalone manager
        run: |
          python -m pip install pyinstaller==6.16.0 customtkinter==5.2.2 pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile --name EndfieldManager --distpath build/package tools/manage.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --add-data "assets;assets" --name EndfieldEnhancer --distpath build/package tools/desktop.py
          build/package/EndfieldManager.exe profiles
          python tools/package_notices.py build/package
          $app = Start-Process build/package/EndfieldEnhancer.exe -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Desktop smoke test failed" }
      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/EndfieldEnhancer.iss'
      - name: Verify setup and uninstall
        run: |
          $setup = Get-ChildItem build/installer/*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'EndfieldSetupTest'
          $install = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $target + '"') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Setup failed' }
          $app = Start-Process (Join-Path $target 'EndfieldEnhancer.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Installed app startup failed' }
          $remove = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path (Join-Path $target 'EndfieldEnhancer.exe')) { throw 'App remains after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: EndfieldEnhancer-windows-x64-experimental
          path: build/package/
      - uses: actions/upload-artifact@v4
        with:
          name: EndfieldEnhancer-setup
          path: build/installer/*.exe
