# Prepares the environment the GitHub Copilot coding agent works in: the same runner, Python and
# pinned packages as build.yml, plus a CMake configure so MinHook is fetched up front.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # No requirements file; the pins below are the dependency list.
          cache-dependency-path: .github/workflows/copilot-setup-steps.yml
      - name: Install Python packages
        run: python -m pip install pyinstaller==6.16.0 customtkinter==5.2.2 pillow==11.3.0
      - name: Configure CMake (fetches MinHook)
        run: cmake -S . -B build -A x64
